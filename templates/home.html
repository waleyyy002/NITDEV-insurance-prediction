<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Charge Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero-panel">
      <span class="eyebrow">Insurance Forecast</span>
      <h1>Predict insurance charges in Naira</h1>
      <p class="hero-copy">Enter the applicant profile below and get an instant estimate for expected insurance billing.</p>
    </header>

    <main class="app-card">
      <form action="/predict" method="POST" class="predict-form">
        <div class="field-row">
          <label class="field-label">Age</label>
          <input type="number" name="age" min="0" placeholder="19" required />
        </div>

        <div class="field-row half-row">
          <div class="field-group">
            <label class="field-label">Sex</label>
            <select name="sex" required>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </div>

          <div class="field-group">
            <label class="field-label">Smoker</label>
            <select name="smoker" required>
              <option value="no">No</option>
              <option value="yes">Yes</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <label class="field-label">BMI</label>
          <input type="number" step="0.1" name="bmi" placeholder="27.9" required />
        </div>

        <div class="field-row half-row">
          <div class="field-group">
            <label class="field-label">Children</label>
            <input type="number" min="0" name="children" placeholder="0" required />
          </div>

          <div class="field-group">
            <label class="field-label">Region</label>
            <select name="region" required>
              <option value="southwest">Southwest</option>
              <option value="southeast">Southeast</option>
              <option value="northwest">Northwest</option>
              <option value="northeast">Northeast</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit">Predict bill</button>
      </form>

      {% if pred %}
      <section class="prediction-panel">
        <span class="prediction-label">Projected charge</span>
        <strong id="prediction-value">Loading...</strong>
        <p class="prediction-note">This is an estimate based on the selected profile.</p>
      </section>
      <script>
        const rawPrediction = "{{ pred|e }}";
        const numericValue = Number(rawPrediction.replace('Expected Bill will', '').trim());
        const formatted = Number.isFinite(numericValue)
          ? new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(numericValue)
          : rawPrediction;
        document.getElementById('prediction-value').textContent = formatted;
      </script>
      {% endif %}
    </main>
  </div>
</body>
</html>
